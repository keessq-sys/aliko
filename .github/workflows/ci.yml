name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Validation does not publish production. Automatic Pages Git publication is disabled.
# Releases use the protected deploy-production.yml workflow or a verified operator.
jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:backend -- --maxWorkers=1 --testTimeout=30000
      - run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test public preview
        run: npx playwright test tests/e2e/preview.spec.ts --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: preview-test-results
          path: test-results/
          retention-days: 7
