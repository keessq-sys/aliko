name: Staging Deployment

on:
  workflow_dispatch:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Deploy isolated staging backend and build
        run: npx convex deploy --cmd "npm run build" --cmd-url-env-var-name PUBLIC_CONVEX_URL --message "Staging ${GITHUB_SHA}"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_STAGING_DEPLOY_KEY }}
      - name: Publish Cloudflare staging branch
        run: npx wrangler pages deploy .svelte-kit/cloudflare --project-name aliko --branch staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
