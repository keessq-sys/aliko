name = "aliko"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

# Data and storage use Convex. Add Cloudflare bindings only when the
# application uses them and real resource IDs have been provisioned.
[vars]
NODE_VERSION = "22"
NODE_ENV = "production"

[env.preview.vars]
NODE_VERSION = "22"
NODE_ENV = "production"

[env.production.vars]
NODE_VERSION = "22"
NODE_ENV = "production"
