name = "aliko-diamond-key"
compatibility_date = "2024-12-01"
pages_build_output_dir = ".svelte-kit/cloudflare"

# ── Environment variables (local `wrangler dev` defaults only) ─────────────
# Named environments below ([env.preview], [env.production]) do NOT inherit
# top-level vars/kv_namespaces/r2_buckets — Wrangler warns and silently
# drops them for the deployed environment otherwise, so every binding below
# is repeated explicitly per environment rather than relying on inheritance.
[vars]
NODE_VERSION = "22"

# ── KV Namespaces (session cache, rate limiting) ────────────────────────────
[[kv_namespaces]]
binding = "SESSIONS_KV"
id = "YOUR_KV_NAMESPACE_ID"          # replace after `wrangler kv namespace create SESSIONS`
preview_id = "YOUR_PREVIEW_KV_ID"

# ── R2 Buckets (property images, generated PDFs) ───────────────────────────
[[r2_buckets]]
binding = "DOCUMENTS_R2"
bucket_name = "aliko-documents"

[[r2_buckets]]
binding = "IMAGES_R2"
bucket_name = "aliko-property-images"

# ── Production secrets (set via: wrangler secret put SECRET_NAME) ──────────
# CONVEX_URL
# CONVEX_DEPLOY_KEY
# AUTH_SECRET                  (openssl rand -base64 33)
# PAYSTACK_SECRET_KEY
# WHATSAPP_PHONE_NUMBER_ID
# WHATSAPP_ACCESS_TOKEN
# WHATSAPP_VERIFY_TOKEN
# DROPBOX_SIGN_API_KEY
# QOREID_CLIENT_ID
# QOREID_CLIENT_SECRET
# GOOGLE_SERVICE_ACCOUNT_KEY   (single-line JSON)
# GOOGLE_CALENDAR_ID

# ── Preview environment (Cloudflare Pages preview/branch deploys) ──────────
[env.preview]

[env.preview.vars]
NODE_VERSION = "22"
NODE_ENV = "preview"

[[env.preview.kv_namespaces]]
binding = "SESSIONS_KV"
id = "YOUR_KV_NAMESPACE_ID"          # replace after `wrangler kv namespace create SESSIONS`
preview_id = "YOUR_PREVIEW_KV_ID"

[[env.preview.r2_buckets]]
binding = "DOCUMENTS_R2"
bucket_name = "aliko-documents"

[[env.preview.r2_buckets]]
binding = "IMAGES_R2"
bucket_name = "aliko-property-images"

# ── Production environment (Cloudflare Pages production branch deploy) ─────
[env.production]

[env.production.vars]
NODE_VERSION = "22"
NODE_ENV = "production"

[[env.production.kv_namespaces]]
binding = "SESSIONS_KV"
id = "YOUR_KV_NAMESPACE_ID"          # replace after `wrangler kv namespace create SESSIONS`
preview_id = "YOUR_PREVIEW_KV_ID"

[[env.production.r2_buckets]]
binding = "DOCUMENTS_R2"
bucket_name = "aliko-documents"

[[env.production.r2_buckets]]
binding = "IMAGES_R2"
bucket_name = "aliko-property-images"
